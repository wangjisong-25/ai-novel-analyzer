<!DOCTYPE html>
<html lang="zh">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小说分析器</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>AI 小说分析器</h1>
        <p class="subtitle">上传小说，AI 自动分析世界观、人物与文风</p>

        <div class="upload-box">
            <label for="fileInput" class="custom-file-upload">
                <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                </svg>
                <span id="fileNameDisplay">点击或拖拽上传 .docx / .txt 小说文件</span>
            </label>
            <input type="file" id="fileInput" style="display: none;">

            <button onclick="uploadFile()" class="analysis-btn">开始分析</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loading-text">AI 正在深度剖析剧情...</p>
        </div>

        <div id="result" class="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
